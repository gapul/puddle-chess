name: PuddleChess
options:
  bundleIdPrefix: net.gapul
  deploymentTarget:
    macOS: "15.2"
  createIntermediateGroups: true

packages:
  ChessKit:
    url: https://github.com/chesskit-app/chesskit-swift
    minVersion: 0.17.0
    maxVersion: 0.18.0

targets:
  PuddleChess:
    type: bundle
    platform: macOS
    sources:
      - path: Source
      - path: Resources
        excludes:
          - "**/.git/**"
    dependencies:
      - package: ChessKit
    info:
      path: Source/Info.plist
      properties:
        # How Puddle finds the class to instantiate.
        NSPrincipalClass: ChessPlugin
        CFBundleName: PuddleChess
        CFBundlePackageType: BNDL
        # What the option string takes, so Puddle's editor can offer it instead of a text field.
        # Puddle reads this as data and still passes the string through untouched.
        PuddleOptions:
          - key: mode
            title: Mode
            default: play
            values: [play, watch]
            titles: [Play against the engine, Watch the engine play itself]
          - key: engine
            title: Stockfish
            default: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gapul.PuddleChess
        WRAPPER_EXTENSION: bundle
        SWIFT_VERSION: "6.0"
        # The bundle is loaded into Puddle; it must not carry its own copy of the Swift runtime.
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
        CODE_SIGN_STYLE: Automatic
